name: aperlo
description: "App Store Screenshot Maker — Screenshot it. Ship it."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Fonts

  # Icons
  lucide_flutter: ^1.20.0

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Image & caching
  cached_network_image: ^3.3.1

  # Local storage
  path_provider: ^2.1.3
  hive_flutter: ^1.1.0

  # Export
  image: ^4.1.7
  share_plus: ^13.3.0

  # Utils
  uuid: ^4.4.0
  image_picker: 1.2.2
  encrypt: ^5.0.3
  gal: ^2.3.2
  permission_handler: ^12.0.3
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Regular.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
    - family: SyneMono
      fonts:
        - asset: assets/fonts/SyneMono-Regular.ttf

  assets:
    - assets/config/store_export_specs.json
    - assets/images/app_icon.png
